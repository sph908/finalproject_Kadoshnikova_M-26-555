[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Торговый хаб для операций с валютами"
readme = "README.md"
authors = [
    { name = "Sofia Kadoshnikova", email = "sph908@yandex.ru" }
]
requires-python = ">=3.12"

dependencies = [
    "prettytable>=3.12.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.valutatrade]
rates_ttl_seconds = 900
base_currency = "USD"

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]